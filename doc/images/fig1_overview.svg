<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'Malgun Gothic','Segoe UI',sans-serif">
  <defs>
    <marker id="arwGold" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#d8a53a"/></marker>
    <marker id="arwBlue" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#3b6fd6"/></marker>
    <marker id="arwGreen" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#2e7d32"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="420" fill="#ffffff"/>
  <text x="20" y="32" font-size="23.8" font-weight="bold" fill="#1b1f24">그림 1. 전체 구조 — 보드 ↔ 브로커 ↔ PC 3개 토픽</text>

  <!-- Board -->
  <rect x="30" y="140" width="190" height="150" rx="10" fill="#d7f0f0" stroke="#0a7d7d" stroke-width="2"/>
  <text x="125" y="175" font-size="20" font-weight="bold" text-anchor="middle" fill="#065c5c">UNO R4</text>
  <text x="125" y="198" font-size="15.4" text-anchor="middle" fill="#065c5c">(보드)</text>
  <text x="125" y="222" font-size="14" text-anchor="middle" fill="#065c5c">analogRead(A0)</text>
  <text x="125" y="242" font-size="14" text-anchor="middle" fill="#065c5c">digitalWrite(LED)</text>

  <!-- Broker -->
  <rect x="355" y="140" width="190" height="150" rx="14" fill="#fdeecb" stroke="#d8a53a" stroke-width="2"/>
  <text x="450" y="180" font-size="20" font-weight="bold" text-anchor="middle" fill="#8a6410">MQTT 브로커</text>
  <text x="450" y="205" font-size="14" text-anchor="middle" fill="#8a6410">test.mosquitto.org</text>
  <text x="450" y="224" font-size="14" text-anchor="middle" fill="#8a6410">(또는 로컬 WSL)</text>

  <!-- PC -->
  <rect x="680" y="140" width="190" height="150" rx="10" fill="#e8eefc" stroke="#3b6fd6" stroke-width="2"/>
  <text x="775" y="180" font-size="20" font-weight="bold" text-anchor="middle" fill="#26468f">PC</text>
  <text x="775" y="203" font-size="14" text-anchor="middle" fill="#26468f">pc_collect_C.py</text>
  <text x="775" y="222" font-size="14" text-anchor="middle" fill="#26468f">CSV + 그래프 + 키 입력</text>

  <!-- Row 1: data  Board -> Broker -> PC (gold) -->
  <line x1="220" y1="168" x2="353" y2="168" stroke="#d8a53a" stroke-width="2.5" marker-end="url(#arwGold)"/>
  <line x1="547" y1="168" x2="678" y2="168" stroke="#d8a53a" stroke-width="2.5" marker-end="url(#arwGold)"/>
  <text x="286" y="158" font-size="13.5" text-anchor="middle" fill="#8a6410">① data</text>
  <text x="612" y="158" font-size="13.5" text-anchor="middle" fill="#8a6410">① data</text>

  <!-- Row 2: led/set  PC -> Broker -> Board (blue) -->
  <line x1="678" y1="215" x2="547" y2="215" stroke="#3b6fd6" stroke-width="2.5" marker-end="url(#arwBlue)"/>
  <line x1="353" y1="215" x2="220" y2="215" stroke="#3b6fd6" stroke-width="2.5" marker-end="url(#arwBlue)"/>
  <text x="286" y="205" font-size="13.5" text-anchor="middle" fill="#26468f">② led/set</text>
  <text x="612" y="205" font-size="13.5" text-anchor="middle" fill="#26468f">② led/set</text>

  <!-- Row 3: led/state  Board -> Broker -> PC (green) -->
  <line x1="220" y1="262" x2="353" y2="262" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#arwGreen)"/>
  <line x1="547" y1="262" x2="678" y2="262" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#arwGreen)"/>
  <text x="286" y="252" font-size="13.5" text-anchor="middle" fill="#2e7d32">③ led/state</text>
  <text x="612" y="252" font-size="13.5" text-anchor="middle" fill="#2e7d32">③ led/state</text>

  <text x="450" y="335" font-size="15.4" text-anchor="middle" fill="#666">보드·PC 모두 발행자(publisher)이자 구독자(subscriber) — BASE_TOPIC은 양쪽에서 반드시 동일해야 함</text>
  <text x="450" y="355" font-size="13.5" text-anchor="middle" fill="#888">① BASE_TOPIC/data "adc,volt" (1초마다)  ·  ② BASE_TOPIC/led/set "1"/"0" (o/f 키)  ·  ③ BASE_TOPIC/led/state "1"/"0" (적용결과)</text>
  <rect x="140" y="380" width="16" height="16" fill="#d8a53a"/><text x="162" y="393" font-size="14" fill="#444">① 센서값(보드→PC)</text>
  <rect x="370" y="380" width="16" height="16" fill="#3b6fd6"/><text x="392" y="393" font-size="14" fill="#444">② LED 명령(PC→보드)</text>
  <rect x="600" y="380" width="16" height="16" fill="#2e7d32"/><text x="622" y="393" font-size="14" fill="#444">③ LED 상태 확인(보드→PC)</text>
</svg>
