<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="'Malgun Gothic','Segoe UI',sans-serif">
  <defs>
    <marker id="arwB" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#3b6fd6"/></marker>
    <marker id="arwG" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#2e7d32"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="520" fill="#ffffff"/>
  <text x="20" y="30" font-size="23.8" font-weight="bold" fill="#1b1f24">그림 3. LED 제어 시퀀스 다이어그램 (o 키 예시)</text>

  <!-- lane headers -->
  <rect x="60"  y="55" width="150" height="40" rx="8" fill="#e8eefc" stroke="#3b6fd6" stroke-width="2"/>
  <text x="135" y="80" font-size="16" font-weight="bold" text-anchor="middle" fill="#26468f">PC (pc_collect_C.py)</text>
  <rect x="305" y="55" width="150" height="40" rx="8" fill="#fdeecb" stroke="#d8a53a" stroke-width="2"/>
  <text x="380" y="80" font-size="16" font-weight="bold" text-anchor="middle" fill="#8a6410">MQTT 브로커</text>
  <rect x="550" y="55" width="150" height="40" rx="8" fill="#d7f0f0" stroke="#0a7d7d" stroke-width="2"/>
  <text x="625" y="80" font-size="16" font-weight="bold" text-anchor="middle" fill="#065c5c">보드 (UNO R4)</text>

  <!-- lifelines -->
  <line x1="135" y1="95" x2="135" y2="480" stroke="#bbb" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="380" y1="95" x2="380" y2="480" stroke="#bbb" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="625" y1="95" x2="625" y2="480" stroke="#bbb" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- step 1: PC key -> publish led/set -->
  <text x="135" y="128" font-size="13.5" text-anchor="middle" fill="#26468f">사용자가 &quot;o&quot; 키 입력</text>
  <line x1="135" y1="140" x2="378" y2="140" stroke="#3b6fd6" stroke-width="2.5" marker-end="url(#arwB)"/>
  <text x="257" y="132" font-size="13.5" text-anchor="middle" fill="#26468f">① publish led/set = &quot;1&quot;</text>

  <!-- step 2: broker -> board -->
  <line x1="380" y1="180" x2="623" y2="180" stroke="#3b6fd6" stroke-width="2.5" marker-end="url(#arwB)"/>
  <text x="500" y="172" font-size="13.5" text-anchor="middle" fill="#26468f">② 구독 중이던 보드에 전달</text>

  <!-- step 3: board processes -->
  <rect x="565" y="205" width="120" height="55" rx="8" fill="#fff7e0" stroke="#d8a53a" stroke-width="1.5"/>
  <text x="625" y="225" font-size="13" text-anchor="middle" fill="#8a6410">③ onMqttMessage()</text>
  <text x="625" y="242" font-size="13" text-anchor="middle" fill="#8a6410">digitalWrite(LED,HIGH)</text>
  <text x="625" y="277" font-size="12.5" text-anchor="middle" fill="#888">(시리얼: 수신[led/set]:1)</text>

  <!-- step 4: board -> broker publish led/state -->
  <line x1="623" y1="300" x2="382" y2="300" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#arwG)"/>
  <text x="500" y="292" font-size="13.5" text-anchor="middle" fill="#1e5e28">④ publish led/state = &quot;1&quot;</text>

  <!-- step 5: broker -> pc -->
  <line x1="380" y1="340" x2="137" y2="340" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#arwG)"/>
  <text x="257" y="332" font-size="13.5" text-anchor="middle" fill="#1e5e28">⑤ 구독 중이던 PC에 전달</text>

  <!-- step 6: pc console -->
  <rect x="75" y="365" width="120" height="55" rx="8" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="135" y="385" font-size="13" text-anchor="middle" fill="#1e5e28">⑥ on_message()</text>
  <text x="135" y="402" font-size="13" text-anchor="middle" fill="#1e5e28">콘솔: LED 상태 ON</text>

  <text x="380" y="460" font-size="14.5" text-anchor="middle" fill="#666">①~⑥ 전체가 1~2초 이내에 끝나야 정상 — 지연·미도착 시 표 2(문제 해결) 참고</text>
</svg>
